name: pokedex
description: PokeDex — explore Pokémon with stats, types and moves.
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Navigation
  go_router: ^16.2.0

  # HTTP
  http: ^1.3.0
  intercepted_http: ^0.2.1

  # Web performance — deferred JS chunk loading per route
  flutter_lazy_load_web: ^0.1.2

  # State management
  provider: ^6.1.2

  # UI
  cached_network_image: ^3.4.1
  google_fonts: ^6.2.1
  lottie: ^3.2.0
  intl: ^0.20.2

  # Utilities
  multiple_result: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.13

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: PokeGoTypes
      fonts:
        - asset: fonts/PokeGOTypes.ttf
